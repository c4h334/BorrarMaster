name: Setup Branches

on:
  push:
    branches:
      - copilot/create-master-and-empty-main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      # Creates the master branch pointing to the current commit (which includes README.md).
      # Force-push is intentional: this workflow is designed to set up the desired
      # branch structure and may overwrite existing content.
      - name: Create or update master branch with README.md
        run: |
          git checkout -B master
          git push origin master --force

      # Creates an empty main branch using a direct commit-tree approach,
      # which reliably produces a commit with an empty tree (no files).
      - name: Create empty main branch
        run: |
          EMPTY_TREE=$(git hash-object -t tree --stdin < /dev/null)
          EMPTY_COMMIT=$(git commit-tree "$EMPTY_TREE" -m "Initial empty commit")
          git push origin "${EMPTY_COMMIT}:refs/heads/main" --force
